name: xlo_flutter_v2
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  command_it: ^8.0.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  lucid_validation: ^1.3.1
  parameterized_test: ^2.0.1
  parse_server_sdk_flutter: ^9.0.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/notoSans/NotoSans-Regular.ttf
        - asset: assets/fonts/notoSans/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/notoSans/NotoSans-Light.ttf
          weight: 300
